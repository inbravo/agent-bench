# Same criteria as LangGraph version — enables apples-to-apples comparison
rubric:
  name: "bcbs239-lineage-crewai"
  version: "1.0"
  judge_prompt_prefix: |
    You are a BCBS 239 expert evaluating an AI crew's data lineage report.
    Score strictly against each criterion.
    Return JSON only — no other text.

  criteria:
    - id: "both_trades_covered"
      weight: 0.30
      description: >
        The report covers both T-20241201-0042 (compliant) and
        T-20241201-0099 (non-compliant with ETL gap).

    - id: "gap_identified"
      weight: 0.30
      description: >
        The crew correctly identifies the missing ETL timestamp on T-20241201-0099.

    - id: "compliance_verdict"
      weight: 0.25
      description: >
        Correct verdicts: T-0042 ready, T-0099 not ready.

    - id: "recommendation_quality"
      weight: 0.15
      description: "Actionable recommendations for resolving gaps."

  scoring:
    formula: "weighted_sum"
    pass_threshold: 0.70

  cpcd:
    formula: "token_cost_usd / quality_score"
    note: "Compare with LangGraph version — CrewAI uses ~2x tokens for the same task"
