rubric:
  name: "tool-use-baseline"
  version: "1.0"
  judge_prompt_prefix: |
    You are evaluating a tool-use baseline agent.
    Score strictly: did it call the right tools and report the results correctly?
    Return JSON only — no other text.

  criteria:
    - id: "tool_calls_correct"
      weight: 0.50
      description: >
        The agent called all three tools (get_market_price, calculate_var,
        fetch_regulation_text) with correct parameters.

    - id: "results_reported"
      weight: 0.30
      description: >
        The final answer accurately reports all three tool results:
        JPM price, VaR amount, and BCBS-239-P4 text.

    - id: "conciseness"
      weight: 0.20
      description: "The answer is concise and contains no hallucinated filler."

  scoring:
    formula: "weighted_sum"
    pass_threshold: 0.70

  cpcd:
    formula: "token_cost_usd / quality_score"
    note: "Baseline CPCD — used to normalise domain example scores"
