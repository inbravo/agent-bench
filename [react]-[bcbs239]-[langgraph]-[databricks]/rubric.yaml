# Same rubric as the Ollama version — CPCD is now meaningful (non-zero cost)
rubric:
  name: "bcbs239-databricks"
  version: "1.0"
  judge_prompt_prefix: |
    You are a BCBS 239 expert evaluating an AI agent's data lineage report.
    Score strictly against each criterion.
    Return JSON only — no other text.

  criteria:
    - id: "both_trades_covered"
      weight: 0.30
      description: >
        The report covers both T-20241201-0042 (compliant) and
        T-20241201-0099 (non-compliant with ETL gap).

    - id: "gap_identified"
      weight: 0.30
      description: >
        The agent correctly identifies the missing ETL timestamp on T-20241201-0099
        and flags it as a BCBS 239 P6 gap.

    - id: "compliance_verdict"
      weight: 0.25
      description: >
        The compliance verdicts are correct: T-0042 ready, T-0099 not ready.

    - id: "recommendation_quality"
      weight: 0.15
      description: >
        The report includes actionable recommendations for resolving the gaps.

  scoring:
    formula: "weighted_sum"
    pass_threshold: 0.70

  cpcd:
    formula: "token_cost_usd / quality_score"
    note: "Non-zero on Databricks — compare with Ollama version for cost insight"
